[project]
name = "farma"
version = "0.1.0"
description = "Farma is a semi-autonomous directed humanitarian and agricultural intelligence System for Food Insecurity in Nigeria"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "earthengine-api>=1.7.10",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.128.0",
    "gunicorn>=23.0.0",
    "google-auth>=2.47.0",
    "google-cloud-storage>=3.0.0",
    "google-genai>=1.0.0",
    "langgraph>=1.0.7",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.0",
    "pandas>=3.0.0",
    "openpyxl>=3.1.5",
    "reportlab>=4.0.0",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
